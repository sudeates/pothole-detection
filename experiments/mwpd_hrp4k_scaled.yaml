# MWPD reviewed-v1 + scale-matched HRP4K crops. Only data (and epochs 100->60, since an epoch is ~2.5x longer) differ from reviewed_v1_baseline.yaml.
model: yolov8n.pt
data: data.mwpd-hrp4k-scaled.yaml
epochs: 60
patience: 100
imgsz: 640
batch: 4
workers: 0
device: 0
seed: 42
deterministic: true
optimizer: auto
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 64
amp: true
rect: false
cos_lr: false
close_mosaic: 10
mosaic: 1.0
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
bgr: 0.0
cache: false
val: true
split: val
iou: 0.7
max_det: 300
save: true
plots: true
